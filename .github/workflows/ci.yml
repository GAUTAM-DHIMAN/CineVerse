name: CineVerse CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Auth Service Build & Test ──────────────────────────────
  auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/auth-service
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: cineverse
          POSTGRES_PASSWORD: cinepass
          POSTGRES_DB: cineverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cineverse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build & Test
        run: ./mvnw clean verify -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cineverse
          SPRING_DATASOURCE_USERNAME: cineverse
          SPRING_DATASOURCE_PASSWORD: cinepass

  # ─── Movie Service Build & Test ─────────────────────────────
  movie-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/movie-service
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build & Test
        run: ./mvnw clean verify -B
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/cineverse_test

  # ─── Booking Service Build & Test ───────────────────────────
  booking-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/booking-service
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: cineverse
          POSTGRES_PASSWORD: cinepass
          POSTGRES_DB: cineverse_bookings
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cineverse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build & Test
        run: ./mvnw clean verify -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/cineverse_bookings
          SPRING_DATASOURCE_USERNAME: cineverse
          SPRING_DATASOURCE_PASSWORD: cinepass
          REDIS_HOST: localhost

  # ─── Review Service Build & Test ────────────────────────────
  review-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/review-service
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build & Test
        run: ./mvnw clean verify -B
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/cineverse_test

  # ─── Gateway Build ──────────────────────────────────────────
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build
        run: ./mvnw clean package -DskipTests -B

  # ─── Frontend Build ─────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build
        run: npm run build
