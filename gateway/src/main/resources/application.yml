server:
  port: 8080
spring:
  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: movies
          uri: http://movie-service:8082
          predicates:
            - Path=/api/movies/**
        - id: reviews
          uri: http://review-service:8083
          predicates:
            - Path=/api/reviews/**
